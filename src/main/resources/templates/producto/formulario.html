<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${producto.codproducto == null} ? 'Nuevo producto · Ferretería El Tornillo' : 'Editar producto · Ferretería El Tornillo'">Producto · Ferretería El Tornillo</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<header class="topbar">
    <div class="topbar__brand"><span class="topbar__mark">FT</span><div class="topbar__brand-text"><span class="topbar__name">Ferretería <strong>El Tornillo</strong></span><span class="topbar__tag">Gestión de inventario</span></div></div>
    <nav class="topbar__nav"><a th:href="@{/productos}" class="topbar__link">Inventario</a><a th:href="@{/productos/nuevo}" class="topbar__link topbar__link--active">Nuevo producto</a></nav>
</header>
<div class="hazard-stripe" aria-hidden="true"></div>
<main class="page page--form">
    <a th:href="@{/productos}" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Volver al inventario</a>
    <div class="ticket">
        <div class="ticket__hole" aria-hidden="true"></div>
        <div class="ticket__header">
            <p class="eyebrow" th:text="${producto.codproducto == null} ? 'Registrar producto' : 'Editar producto'">Registrar producto</p>
            <h1 th:text="${producto.codproducto == null} ? 'Nuevo producto' : 'Editar producto'">Nuevo producto</h1>
        </div>
        <div class="ticket__perforation" aria-hidden="true"></div>
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="form">
            <input type="hidden" th:field="*{codproducto}">
            <div class="field"><label for="nombre">Nombre del producto</label><input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Martillo de carpintero 16 oz" required></div>
            <div class="field-row">
                <div class="field">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" th:field="*{categoria}" required>
                        <option value="" disabled selected>Selecciona una categoría</option>
                        <option value="Herramientas manuales">Herramientas manuales</option>
                        <option value="Herramientas eléctricas">Herramientas eléctricas</option>
                        <option value="Tornillería y anclajes">Tornillería y anclajes</option>
                        <option value="Pintura y acabados">Pintura y acabados</option>
                        <option value="Plomería">Plomería</option>
                        <option value="Eléctrico">Eléctrico</option>
                        <option value="Materiales de construcción">Materiales de construcción</option>
                        <option value="Seguridad industrial">Seguridad industrial</option>
                        <option value="Jardinería">Jardinería</option>
                        <option value="Adhesivos y selladores">Adhesivos y selladores</option>
                    </select>
                </div>
                <div class="field field--narrow"><label for="stock">Stock disponible</label><input type="number" id="stock" th:field="*{stock}" min="0" step="1" placeholder="0" required></div>
            </div>
            <div class="field"><label for="precio">Precio unitario (COP)</label><div class="input-prefix"><span>$</span><input type="number" id="precio" th:field="*{precio}" min="0" step="100" placeholder="0" required></div></div>
            <div class="field"><label for="descripcion">Descripción <span class="optional">(opcional)</span></label><textarea id="descripcion" th:field="*{descripcion}" rows="3" placeholder="Marca, medidas u otros detalles del producto..."></textarea></div>
            <div class="form__actions">
                <a th:href="@{/productos}" class="btn btn--ghost">Cancelar</a>
                <button type="submit" class="btn btn--primary" th:text="${producto.codproducto == null} ? 'Guardar producto' : 'Guardar cambios'">Guardar producto</button>
            </div>
        </form>
    </div>
</main>
<footer class="footer"><p>Ferretería El Tornillo — Sistema interno de inventario</p></footer>
</body>
</html>
